<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chioma's Calculator</title>
    <!--This link below fetches the JetBrains Mono font from Google's servers, since it isn't installed on most computers by default.-->
    <!--rel="stylesheet" on the same line with the link tells the browser to load and apply it like a styleshet.-->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono',  monospace;
            background-color: #16171a;
            color: #edebe6;
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        #calculator {
            background-color: #1f2023;
            width: 320px;
            padding: 20px;
            border-radius: 16px;
        }
        #display {
            background: #26282c;
            border-radius: 12px;
            padding: 20px;
            font-size: 34px;
            text-align: right;
            margin-bottom: 16px;
        }
        button {
            border: none;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            padding: 16px 0;
            cursor: pointer;
            color: #edebe6;
        } 
        #keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .digit {
            background-color: #2c2e33;
        }
        .operator {
            background-color: #6b5228;
            color: #e9a23b;
        }
        #total {
            background-color: #e9a23b;
            color: #1a1206;
        }
        .utility {
            background-color: #2c2e33;
            color: #8b8f94;
        }
        #zero {
            grid-column: span 2;
            background-color: #2c2e33;
        }
        .decimal {
            background-color: #2c2e33;
            color: #edebe6;
        }
        #rating {
            display: flex;
            gap: 8px;
        }
        #rating button {
            border: none;
            background: none;
            font-size: 28px;
            color: #8b8f94;
            cursor: pointer;
        }
        .kicker {
            color: #8b8f94;
            font-size: 13px;
            margin: 0;
        }
        h2, h3 {
            margin: 0;
        }
        #ratingSection h3 {
            margin: 8px;
        }
        
    </style>
</head>
<body>
    <div id = "header">
        <h2>Chioma's Calculator</h2>
        <p class = "kicker">python project, first build</p>
    </div>

    <div id = "calculator">
        <div id = "display">0</div>
        <div id = "keys"> 
            <button id = "clear" class="utility">C</button>
            <button id = "backspace" class="utility">⌫</button>
            <button id = "percent" class="utility">%</button>
            <button class="operator">/</button>
            <button class="digit">7</button>
            <button class="digit">8</button>
            <button class="digit">9</button>
            <button class="operator">*</button>
            <button class="digit">4</button>
            <button class="digit">5</button>
            <button class="digit">6</button>
            <button class="operator">-</button>
            <button class="digit">1</button>
            <button class="digit">2</button>
            <button class="digit">3</button>
            <button class="operator">+</button>
            <button id = "zero" class="digit">0</button>
            <button class="decimal">.</button>
            <button id = "total">=</button>    
        </div>

        <div>
            <p class = "kicker">built from scratch while learning python</p>
        </div>
    </div>

    <div id = "ratingSection">
        <h3>Rate this project</h3>
        <div id = "rating">
            <button>★</button>
            <button>★</button>
            <button>★</button>
            <button>★</button>
            <button>★</button>
        </div>
    </div> 

    <script>
        let display = document.getElementById("display");
        console.log(display)

        let firstNumber = null;
        let currentOperator = null;
        let startFresh = true;

        function addition(first_Number, second_Number) {
            return first_Number + second_Number;
        }
        function subtraction(first_Number, second_Number) {
            return first_Number - second_Number;
        }
        function multiplication(first_Number, second_Number) {
            return first_Number * second_Number;
        }
        function division(first_Number, second_Number) {
            if (second_Number === 0) {
                return null;
            }
            return first_Number / second_Number;
        }

        document.querySelectorAll(".operator").forEach(function(button) {
            button.addEventListener("click", function() {
                firstNumber = parseFloat(display.textContent);
                currentOperator = this.textContent
                display.textContent = currentOperator
                startFresh = true
            })
        })

        let clearButton = document.getElementById("clear");
        clearButton.addEventListener("click", function() {
            console.log(display.textContent = "0")
            startFresh = true
        });

        document.querySelectorAll(".digit").forEach(function(button) {
            button.addEventListener("click", function() {
                if (startFresh) {
                    display.textContent = this.textContent
                    startFresh = false
                } else {
                    display.textContent += this.textContent
                }
            })
        });

        let totalButton = document.getElementById("total");
        totalButton.addEventListener("click", function() {
            let secondNumber = parseFloat(display.textContent);
            let result;

            if (currentOperator === "+") {
                result = addition(firstNumber, secondNumber);
            } else if (currentOperator === "-") {
                result = subtraction(firstNumber, secondNumber);
            } else if (currentOperator === "*") {
                result = multiplication(firstNumber, secondNumber);
            } else if (currentOperator === "/") {
                result = division(firstNumber, secondNumber); 
            }

            if (result === null) {
                display.textContent = ("Can't divide by zero")
            } else {
                display.textContent = result;
            }
        })

        let decimalButton = document.querySelector(".decimal");
        decimalButton.addEventListener("click", function() {
            if (display.textContent.includes(".")) {
                
            } else {
                display.textContent += decimalButton.textContent
            }
        })

        let deleteButton = document.getElementById("backspace");
        deleteButton.addEventListener("click", function() {
            display.textContent = display.textContent.slice(0, -1);
            if (display.textContent.length === 0) {
                display.textContent = "0"
                startFresh = true
            }
        })

        let percentButton = document.getElementById("percent");
        percentButton.addEventListener("click", function() {
            let currentValue = parseFloat(display.textContent);
            display.textContent = currentValue / 100
        })

        document.querySelectorAll("#rating button").forEach(function(button, index) {
            button.addEventListener("click", function() {
                document.querySelectorAll("#rating button").forEach(function(star, starIndex) {
                    if (starIndex <= index) {
                        star.style.color = "#e9a23b";
                    } else {
                        star.style.color = "#8b8f94";
                    }
                })
            })
        })
    </script>
</body>
</html>
